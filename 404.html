  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0a0a0a;
      --paper: #fafafa;
      --mid: #6b6b6b;
      --light: #e8e8e8;
      --accent: #e63312;
      --accent-soft: rgba(230, 51, 18, 0.08);
      --mono: 'Space Mono', monospace;
      --sans: 'Outfit', sans-serif;
      --container: 1120px;
      --gutter: clamp(1.2rem, 4vw, 3rem);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      font-size: 1rem;
      line-height: 1.65;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    /* NAV */
    .nav { background: rgba(250,250,250,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--light); }
    .nav__inner { max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; }
    .nav__logo { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; }
    .nav__logo img { width: 36px; height: 36px; object-fit: contain; }
    .nav__logo-text { display: flex; flex-direction: column; line-height: 1.1; }
    .nav__logo-mark { font-family: var(--mono); font-weight: 700; font-size: 1rem; color: var(--ink); letter-spacing: -0.02em; }
    .nav__logo-tagline { font-family: var(--sans); font-size: 0.62rem; color: var(--mid); font-weight: 400; letter-spacing: 0.02em; }
    .nav__cta { display: inline-flex; align-items: center; padding: 0.5rem 1.1rem; background: var(--ink); color: var(--paper); font-family: var(--sans); font-size: 0.85rem; font-weight: 600; border-radius: 4px; white-space: nowrap; transition: background 0.2s; }
    .nav__cta:hover { background: var(--accent); }

    /* SUCCESS CONTENT */
    .success { flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem var(--gutter); position: relative; overflow: hidden; }

    .success::before {
      content: '404';
      position: absolute;
      right: -0.05em;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--mono);
      font-weight: 700;
      font-size: clamp(5rem, 14vw, 16rem);
      color: var(--ink);
      opacity: 0.02;
      pointer-events: none;
      user-select: none;
      line-height: 1;
      white-space: nowrap;
    }

    .success__card {
      max-width: 580px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .success__check {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      animation: scaleIn 0.4s 0.2s ease both;
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 1; transform: scale(1); }
    }

    .success__check svg {
      width: 32px;
      height: 32px;
      stroke: #fff;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .success__check svg path {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: drawCheck 0.5s 0.5s ease forwards;
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    .success__tag {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .success__tag::before {
      content: '';
      display: inline-block;
      width: 20px;
      height: 1.5px;
      background: var(--accent);
    }

    .success__tag::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 1.5px;
      background: var(--accent);
    }

    .success__card h1 {
      font-family: var(--sans);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 700;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    .success__card h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .success__card > p {
      font-size: 1.05rem;
      color: var(--mid);
      line-height: 1.7;
      margin-bottom: 2.5rem;
      max-width: 460px;
      margin-inline: auto;
    }

    .success__steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      margin-bottom: 2.5rem;
      text-align: left;
    }

    .success__step {
      border: 1.5px solid var(--light);
      border-radius: 6px;
      padding: 1.25rem;
      transition: border-color 0.2s;
    }

    .success__step:hover { border-color: var(--accent); }

    .success__step-num {
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 0.5rem;
      display: block;
    }

    .success__step h3 {
      font-family: var(--sans);
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .success__step p {
      font-size: 0.78rem;
      color: var(--mid);
      line-height: 1.55;
    }

    .success__actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1.5rem;
      font-family: var(--sans);
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 4px;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      text-decoration: none;
      line-height: 1.2;
    }

    .btn--fill { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn--fill:hover { background: #c42a0e; border-color: #c42a0e; }
    .btn--outline { background: transparent; color: var(--ink); border-color: var(--ink); }
    .btn--outline:hover { background: var(--ink); color: var(--paper); }

    /* FOOTER */
    .foot { padding: 2rem 0; border-top: 1px solid var(--light); text-align: center; font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid); }
    .foot a { color: var(--mid); text-decoration: none; }
    .foot a:hover { color: var(--accent); }

    @media (max-width: 600px) {
      .success__steps { grid-template-columns: 1fr; }
    }
  </style>
</head>

<section class="success">

    <h1>This page <em>moved on</em> without telling us</h1>
    <p>The link you followed does not exist anymore, or never did. No worries, everything worth reading is still here.</p>

    <div class="success__actions">

    </div>

  </div>
</section>

  </div>
</footer>

document.getElementById('current-year').textContent = new Date().getFullYear();
